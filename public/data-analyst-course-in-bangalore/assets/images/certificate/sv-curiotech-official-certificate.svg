<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B144"/>
      <stop offset="35%" stop-color="#FBE288"/>
      <stop offset="70%" stop-color="#D49925"/>
      <stop offset="100%" stop-color="#9E6E12"/>
    </linearGradient>
    <linearGradient id="ribbonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2B7A"/>
      <stop offset="50%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="cornerWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cornerWaveDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Base Certificate Background -->
  <rect x="0" y="0" width="1200" height="840" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Frame -->
  <rect x="25" y="25" width="1150" height="790" fill="none" stroke="#E2E8F0" stroke-width="2" rx="4"/>
  <rect x="35" y="35" width="1130" height="770" fill="none" stroke="#CBD5E1" stroke-dasharray="6,4" stroke-width="1" rx="4"/>

  <!-- Top Right Geometric Wave Corners -->
  <path d="M 850 0 C 950 40, 1050 30, 1200 160 L 1200 0 Z" fill="url(#cornerWaveDark)" opacity="0.9"/>
  <path d="M 920 0 C 1020 70, 1100 80, 1200 240 L 1200 0 Z" fill="url(#cornerWave)" opacity="0.85"/>
  <path d="M 1020 0 C 1100 90, 1150 150, 1200 320 L 1200 0 Z" fill="#9333EA" opacity="0.75"/>
  <path d="M 1120 0 C 1160 80, 1180 140, 1200 210 L 1200 0 Z" fill="#C084FC" opacity="0.6"/>

  <!-- Bottom Left Geometric Wave Corners -->
  <path d="M 0 680 C 150 710, 250 800, 350 840 L 0 840 Z" fill="url(#cornerWaveDark)" opacity="0.9"/>
  <path d="M 0 600 C 100 660, 180 750, 280 840 L 0 840 Z" fill="url(#cornerWave)" opacity="0.85"/>
  <path d="M 0 520 C 50 690, 100 770, 180 840 L 0 840 Z" fill="#9333EA" opacity="0.75"/>
  <path d="M 0 630 C 40 700, 60 760, 80 840 L 0 840 Z" fill="#C084FC" opacity="0.6"/>

  <!-- Brand Logo Top Left -->
  <g transform="translate(70, 50)">
    <!-- Node circuits & Star -->
    <path d="M 35 32 C 20 32, 10 42, 10 55 C 10 70, 35 78, 45 88 C 55 98, 45 112, 30 112 C 15 112, 8 102, 8 92" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="32" r="5" fill="#2563EB"/>
    <circle cx="8" cy="92" r="5" fill="#2563EB"/>
    
    <path d="M 50 50 L 72 105 L 95 38" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="38" r="5" fill="#7C3AED"/>

    <!-- Central Sparkle -->
    <g transform="translate(56, 52)">
      <polygon points="0,-18 3,-4 18,0 3,4 0,18 -3,4 -18,0 -3,-4" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Logo Typography -->
    <text x="6" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="1">SV</text>
    <text x="6" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#0F172A" letter-spacing="3">CURIOTECH</text>
    <text x="6" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" fill="#334155" letter-spacing="0.5">INNOVATING EDUCATION THROUGH TECHNOLOGY</text>
  </g>

  <!-- Certificate Heading -->
  <text x="600" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#0F172A" letter-spacing="6">CERTIFICATE</text>
  
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#4B5563" letter-spacing="3">OF SUCCESSFULLY COMPLETED THE COURSE</text>

  <!-- Decorative Flourish Divider -->
  <g transform="translate(600, 230)">
    <line x1="-160" y1="0" x2="-25" y2="0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="-15" cy="0" r="4" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#4F46E5"/>
    <circle cx="15" cy="0" r="4" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
    <line x1="25" y1="0" x2="160" y2="0" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Recipient Presentation Line -->
  <text x="600" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#475569" letter-spacing="2">THIS CERTIFICATE IS PROUDLY PRESENTED TO</text>

  <!-- Candidate Name -->
  <text x="600" y="375" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#2E1065" letter-spacing="2">SHWETA SERVESH</text>
  <line x1="340" y1="392" x2="860" y2="392" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Completion Statement -->
  <text x="600" y="435" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#334155">has successfully completed the course and demonstrated</text>
  <text x="600" y="465" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#334155">the required knowledge and skills in</text>

  <!-- Course Badge Ribbon -->
  <g transform="translate(600, 520)">
    <!-- Slanted accent brackets -->
    <path d="M -245 -22 L -235 22" stroke="#1E2B7A" stroke-width="8" stroke-linecap="round"/>
    <path d="M -235 -22 L -225 22" stroke="#4338CA" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Central Pill -->
    <rect x="-215" y="-25" width="430" height="50" rx="4" fill="url(#ribbonBlue)"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="3">SAP FICO CONSULTANT</text>
    
    <path d="M 225 -22 L 235 22" stroke="#4338CA" stroke-width="8" stroke-linecap="round"/>
    <path d="M 235 -22 L 245 22" stroke="#1E2B7A" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="220" y1="620" x2="980" y2="620" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Footer Information Columns -->
  <!-- Left: Certificate Code -->
  <g transform="translate(340, 670)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">CERTIFICATE CODE</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">SVC257</text>
    <line x1="-50" y1="36" x2="50" y2="36" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Center: Golden Seal Medallion -->
  <g transform="translate(600, 700)">
    <!-- Sunburst Ribbon Edge -->
    <circle cx="0" cy="0" r="48" fill="url(#goldSeal)" filter="url(#cardShadow)"/>
    <!-- Scalloped gear edge effect -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="39" fill="url(#goldSeal)"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#78350F" stroke-width="1.2"/>
    
    <!-- Seal Text -->
    <text x="0" y="-8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#451A03" letter-spacing="1">COURSE</text>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#451A03" letter-spacing="1">COMPLETED</text>
    <text x="0" y="22" text-anchor="middle" font-size="14" fill="#451A03">★★★</text>
  </g>

  <!-- Right: Issue Date -->
  <g transform="translate(860, 670)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">ISSUE DATE</text>
    <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">06/10/2026</text>
    <line x1="-50" y1="36" x2="50" y2="36" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Far Right QR Code & Verification Block -->
  <g transform="translate(1040, 670)">
    <rect x="-35" y="-35" width="70" height="70" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" rx="3"/>
    
    <!-- Stylized QR Code Pattern -->
    <g fill="#0F172A">
      <!-- Top Left Finder Pattern -->
      <rect x="-28" y="-28" width="18" height="18"/>
      <rect x="-25" y="-25" width="12" height="12" fill="#FFFFFF"/>
      <rect x="-22" y="-22" width="6" height="6"/>

      <!-- Top Right Finder Pattern -->
      <rect x="10" y="-28" width="18" height="18"/>
      <rect x="13" y="-25" width="12" height="12" fill="#FFFFFF"/>
      <rect x="16" y="-22" width="6" height="6"/>

      <!-- Bottom Left Finder Pattern -->
      <rect x="-28" y="10" width="18" height="18"/>
      <rect x="-25" y="13" width="12" height="12" fill="#FFFFFF"/>
      <rect x="-22" y="16" width="6" height="6"/>

      <!-- Data Dots -->
      <rect x="-5" y="-28" width="4" height="4"/>
      <rect x="2" y="-20" width="4" height="4"/>
      <rect x="-6" y="-12" width="6" height="6"/>
      <rect x="0" y="-5" width="5" height="5"/>
      <rect x="12" y="-2" width="4" height="4"/>
      <rect x="-18" y="-2" width="5" height="5"/>
      <rect x="-5" y="8" width="6" height="6"/>
      <rect x="12" y="12" width="5" height="5"/>
      <rect x="2" y="20" width="6" height="6"/>
      <rect x="20" y="22" width="4" height="4"/>
    </g>

    <!-- Scan to Verify Pill -->
    <rect x="-50" y="44" width="100" height="16" rx="2" fill="#1E293B"/>
    <text x="0" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" letter-spacing="1">SCAN TO VERIFY</text>

    <!-- Verification URL -->
    <rect x="-70" y="66" width="140" height="18" rx="2" fill="#2563EB"/>
    <text x="0" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">https://www.svcuriotech.com/</text>
  </g>
</svg>
